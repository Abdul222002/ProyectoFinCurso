
services:
  db:
    image: mysql:8.0
    container_name: football-fantasy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ultimate_fantasy_legends.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/scripts/fix_player_names_mojibake.sql:/docker-entrypoint-initdb.d/zzz_fix_player_names_mojibake.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: football-fantasy-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - SPORTMONKS_API_KEY=${SPORTMONKS_API_KEY}
      - BYPASS_EMAIL_VERIFICATION=${BYPASS_EMAIL_VERIFICATION}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/backend
      - ./backend/static/players:/backend/static/players

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-fantasy-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend/static:/usr/share/nginx/html/static:ro

volumes:
  mysql_data:
