version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: football-fantasy-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - MYSQL_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-fantasy-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
