
services:
  db:
    image: mysql:8.0
    container_name: football-fantasy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fantasyleague2026}
      MYSQL_DATABASE: ultimate_fantasy_legends
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ultimate_fantasy_legends.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/scripts/fix_player_names_mojibake.sql:/docker-entrypoint-initdb.d/zzz_fix_player_names_mojibake.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: football-fantasy-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-fantasyleague2026}
      - MYSQL_DATABASE=ultimate_fantasy_legends
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SPORTMONKS_API_KEY=${SPORTMONKS_API_KEY}
      - BYPASS_EMAIL_VERIFICATION=${BYPASS_EMAIL_VERIFICATION:-false}
    volumes:
      - ./backend/static/players:/backend/static/players

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-fantasy-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:
