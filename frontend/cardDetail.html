<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Player Card &amp; Stats Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#25f478",
              "primary-dark": "#1bc45e",
              "background-light": "#f5f8f7",
              "background-dark": "#102217",
              "surface-dark": "#152e20",
              "surface-card": "#0c1a12"
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
              "glow": "0 0 20px rgba(37, 244, 120, 0.15)",
              "glow-strong": "0 0 30px rgba(37, 244, 120, 0.3)",
              "card": "0 10px 30px -5px rgba(0, 0, 0, 0.5)"
            }
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar hide for horizontal scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Foil effect for the card */
        .foil-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            position: relative;
            overflow: hidden;
        }
        .foil-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                transparent 40%,
                rgba(255, 215, 0, 0.1) 45%, /* Gold tint for Legend */
                rgba(37, 244, 120, 0.2) 50%, /* Primary tint */
                transparent 55%
            );
            transform: rotate(30deg);
            pointer-events: none;
        }

        /* Graph gradient */
        .graph-gradient {
            background: linear-gradient(180deg, rgba(37, 244, 120, 0.2) 0%, rgba(37, 244, 120, 0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-100 min-h-screen pb-28 relative">
<!-- Header -->
<header class="fixed top-0 left-0 right-0 z-50 p-6 flex justify-between items-center bg-gradient-to-b from-background-dark to-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-dark/50 backdrop-blur-md text-white hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-icons-round">arrow_back</span>
</button>
<div class="flex gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-dark/50 backdrop-blur-md text-white hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-icons-round">share</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-dark/50 backdrop-blur-md text-primary hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-icons-round">favorite</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="container mx-auto max-w-md px-6 pt-20">
<!-- Hero Card Section -->
<section class="relative flex flex-col items-center mb-8">
<!-- Glow background -->
<div class="absolute top-10 w-64 h-80 bg-primary/20 rounded-full blur-3xl -z-10"></div>
<!-- The Card -->
<div class="w-full aspect-[2/3] max-w-[280px] rounded-xl foil-card shadow-card border border-white/10 p-4 flex flex-col relative group transform transition-transform duration-500 hover:scale-[1.02]">
<!-- Card Top: Rating & Position -->
<div class="flex justify-between items-start z-10">
<div class="flex flex-col items-center">
<span class="text-3xl font-bold text-white leading-none">88</span>
<span class="text-sm font-semibold text-primary uppercase">ST</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-white/20">
<img alt="Scotland Flag" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB77lTqV2xfpOi7aMePMIvJZyXnQ6G_va5_cU9t6Hy3GBXXDyGOE5RTbPtpG-OgpFr1fMOxX3PJwqeAGPkXF7dxBroBqLz1bDQm7P94YRRamjzTdIqrHp3eFpEjr7no9hb_1FbXePtqXEwWzpMyEt0TOX66o3m2TO7273Wdqm9X2tnXK-bXB2IN9WrZ9VlI-Lq6Muk3ZI_-JYiZPOgNvCtFTBvvBE2E1kn0Nv4WzLJK_7IjMOdmDgXEKOjU98N6vaW5QCJWYjoF4JY"/>
</div>
</div>
<!-- Player Image -->
<div class="flex-1 relative z-10 -mt-2">
<img class="w-full h-full object-cover object-top mask-image-gradient" data-alt="Action shot of a soccer player kicking ball dynamic pose" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDjH4A_r8iXLoy77UKdKb7K8UbwdiifNTXtb83lc2tfnKGQwhwZaWQf3eWZTw0anTRYlvmiZyP8eQ5JJpgn0mLK30d3VJw-VNSeXhLRSuvOopfhiQQ_qX0OvZjuJUSGLSxkTJKYyn_ZZqgfPYc2Del4OWKv2rte0PV-2ac0EGs7N3gfViSmgrndCxgTTZqeCXJ905suRZMbn9T8EnN0vpAcA9hkG7IlIq0cPMAz6GuF3ymPiFS3-P4XbKHNEvdioTsdpcSIs28do8" style="mask-image: linear-gradient(to bottom, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);"/>
</div>
<!-- Card Bottom: Name & Team -->
<div class="relative z-10 mt-auto text-center pb-2">
<h2 class="text-2xl font-bold text-white uppercase tracking-wider mb-1">Shankland</h2>
<div class="h-0.5 w-16 bg-gradient-to-r from-transparent via-primary to-transparent mx-auto mb-2"></div>
<div class="flex justify-center items-center gap-2 opacity-80">
<div class="w-5 h-5 bg-white/10 rounded-full flex items-center justify-center text-[10px]">HM</div> <!-- Hearts Logo Placeholder -->
<span class="text-xs font-light text-gray-300">Heart of Midlothian</span>
</div>
</div>
<!-- Card Stats Row -->
<div class="grid grid-cols-6 gap-1 text-center text-[10px] text-gray-400 font-bold border-t border-white/10 pt-2 mt-2 z-10">
<div class="flex flex-col"><span class="text-white">84</span>PAC</div>
<div class="flex flex-col"><span class="text-primary">89</span>SHO</div>
<div class="flex flex-col"><span class="text-white">76</span>PAS</div>
<div class="flex flex-col"><span class="text-white">82</span>DRI</div>
<div class="flex flex-col"><span class="text-white">45</span>DEF</div>
<div class="flex flex-col"><span class="text-white">85</span>PHY</div>
</div>
<!-- Legend Badge -->
<div class="absolute -top-3 -right-3 bg-gradient-to-r from-yellow-500 to-yellow-700 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-lg border border-yellow-300 transform rotate-12 z-20">
                    LEGEND
                </div>
</div>
</section>
<!-- Stats Detail Section -->
<section class="mb-8">
<div class="flex items-center justify-between mb-4 px-2">
<h3 class="text-lg font-bold text-white">Season Stats</h3>
<span class="text-[10px] bg-surface-dark px-2 py-1 rounded text-gray-400 flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Sportmonks API
                </span>
</div>
<div class="grid grid-cols-2 gap-3">
<!-- Large Match Rating Box -->
<div class="col-span-2 bg-surface-dark p-4 rounded-lg flex items-center justify-between border border-white/5">
<div>
<p class="text-sm text-gray-400 font-light mb-1">Match Rating</p>
<div class="flex items-baseline gap-2">
<span class="text-3xl font-bold text-primary">7.8</span>
<span class="text-xs text-green-400 font-medium flex items-center">
<span class="material-icons-round text-sm">trending_up</span> +0.2
                            </span>
</div>
</div>
<!-- Circular Progress -->
<div class="relative w-14 h-14">
<svg class="w-full h-full transform -rotate-90">
<circle class="text-gray-700" cx="28" cy="28" fill="transparent" r="24" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary" cx="28" cy="28" fill="transparent" r="24" stroke="currentColor" stroke-dasharray="150" stroke-dashoffset="30" stroke-width="4"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-[10px] font-bold">AVG</span>
</div>
</div>
</div>
<!-- Stat Box 1 -->
<div class="bg-surface-dark p-4 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
<span class="text-2xl font-bold text-white mb-1">24</span>
<span class="text-xs text-gray-400 uppercase tracking-wider">Goals</span>
</div>
<!-- Stat Box 2 -->
<div class="bg-surface-dark p-4 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
<span class="text-2xl font-bold text-white mb-1">4</span>
<span class="text-xs text-gray-400 uppercase tracking-wider">Assists</span>
</div>
<!-- Stat Box 3 -->
<div class="bg-surface-dark p-4 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
<span class="text-2xl font-bold text-white mb-1">2,140</span>
<span class="text-xs text-gray-400 uppercase tracking-wider">Minutes</span>
</div>
<!-- Stat Box 4 -->
<div class="bg-surface-dark p-4 rounded-lg border border-white/5 flex flex-col items-center justify-center text-center">
<span class="text-2xl font-bold text-white mb-1">62%</span>
<span class="text-xs text-gray-400 uppercase tracking-wider">Dribbles</span>
</div>
</div>
</section>
<!-- Market Value Section -->
<section class="mb-24">
<div class="flex items-center justify-between mb-4 px-2">
<h3 class="text-lg font-bold text-white">Market Value</h3>
<div class="flex bg-surface-dark rounded-full p-1">
<button class="px-3 py-1 text-xs font-medium text-gray-400 hover:text-white transition-colors">1W</button>
<button class="px-3 py-1 text-xs font-bold text-background-dark bg-primary rounded-full shadow-glow">1M</button>
<button class="px-3 py-1 text-xs font-medium text-gray-400 hover:text-white transition-colors">YTD</button>
</div>
</div>
<div class="bg-surface-dark rounded-xl p-5 border border-white/5 relative overflow-hidden">
<!-- Value Header -->
<div class="flex justify-between items-end mb-6 relative z-10">
<div>
<p class="text-xs text-gray-400 font-light mb-1">Current Value</p>
<h4 class="text-2xl font-bold text-white">₣ 12,500</h4>
</div>
<div class="text-right">
<p class="text-xs text-gray-400 font-light mb-1">Change</p>
<span class="text-sm font-bold text-green-400">+12.4%</span>
</div>
</div>
<!-- Graph -->
<div class="h-32 w-full relative z-10">
<!-- Simple CSS-only visual representation of a line graph -->
<svg class="w-full h-full overflow-visible" viewbox="0 0 300 100">
<defs>
<lineargradient id="gradientArea" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#25f478" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#25f478" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Area path -->
<path d="M0,80 C30,75 50,90 80,60 C110,30 140,50 170,40 C200,30 230,20 300,10 L300,100 L0,100 Z" fill="url(#gradientArea)"></path>
<!-- Line path -->
<path d="M0,80 C30,75 50,90 80,60 C110,30 140,50 170,40 C200,30 230,20 300,10" fill="none" stroke="#25f478" stroke-linecap="round" stroke-width="3"></path>
<!-- Tooltip dot -->
<circle class="shadow-glow-strong" cx="300" cy="10" fill="#25f478" r="4"></circle>
</svg>
</div>
</div>
</section>
</main>
<!-- Sticky Footer Actions -->
<footer class="fixed bottom-6 left-6 right-6 z-40">
<div class="bg-surface-card/90 backdrop-blur-xl border border-white/10 p-2 rounded-full flex gap-2 shadow-2xl">
<button class="flex-1 bg-surface-dark hover:bg-surface-dark/80 text-primary border border-primary/20 h-14 rounded-full font-bold text-sm transition-all flex items-center justify-center gap-2">
<span class="material-icons-round text-lg">verified_user</span>
                Set Captain
            </button>
<button class="flex-[1.5] bg-primary hover:bg-primary-dark text-background-dark h-14 rounded-full font-bold text-sm shadow-glow transition-all flex items-center justify-center gap-2">
                Sell in Market
                <span class="material-icons-round text-lg">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
