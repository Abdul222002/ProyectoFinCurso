server {
    listen       80;
    server_name  localhost;

    # Habilitar compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    charset utf-8;
    root   /usr/share/nginx/html;
    index  index.html;

    # Todas las rutas deben redirigirse a index.html para que React Router maneje el enrutamiento
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el Backend (API)
    # En Railway, puedes usar el nombre del servicio (ej: backend) si están en el mismo proyecto
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Servir Imágenes Estáticas directamente (más rápido)
    location ^~ /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex off;
        # Cache agresiva para imágenes de jugadores
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }



    # Configuraciones de caché para contenido estático (opcional pero recomendado)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Redireccionar errores de servidor al html estático de error por defecto de nginx
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
