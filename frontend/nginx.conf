server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root   /usr/share/nginx/html;
    index  index.html;

    # Todas las rutas deben redirigirse a index.html para que React Router maneje el enrutamiento
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: llamadas a /api/ se redirigen al backend
    location /api/ {
        proxy_pass http://football-fantasy-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuraciones de caché para contenido estático (opcional pero recomendado)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Redireccionar errores de servidor al html estático de error por defecto de nginx
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
