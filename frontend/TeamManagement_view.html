<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25f478",
                        "background-light": "#f5f8f7",
                        "background-dark": "#102217",
                        "card-gold": "#FFD700",
                        "card-silver": "#C0C0C0",
                        "card-bronze": "#CD7F32",
                        "card-legend": "#9333EA", // Purple for legend

                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]

                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},

<style>
        /* Custom scrollbar hiding for clean mobile look */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Pitch perspective transform */
        .pitch-perspective {
            transform: perspective(1000px) rotateX(20deg);
            transform-origin: center bottom;
        }
        
        /* Card gradients */
        .card-bg-gold { background: linear-gradient(135deg, #423806 0%, #1a1500 100%); border-color: #FFD700; }

        /* Shine effect for legend cards */

<style>
